[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geneaugust-query_rewrite_drift_threshold_scan"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "geneaugust" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://geneaugust.github.io"
Repository = "https://github.com/geneaugust/query_rewrite_drift_threshold_scan"
Issues = "https://github.com/geneaugust/query_rewrite_drift_threshold_scan/issues"

[project.scripts]
query_rewrite_drift_threshold_scan = "query_rewrite_drift_threshold_scan:main"

[tool.setuptools]
py-modules = ["query_rewrite_drift_threshold_scan"]
